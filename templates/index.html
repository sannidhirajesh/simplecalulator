<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">CALC</div>
            <div class="subtitle">Simple Calculator</div>
        </header>

        <main class="calculator-layout">
            <section class="calculator">
                <div class="display">
                    <div id="previous">Ready</div>
                    <div id="current">0</div>
                </div>

                <div class="keypad">
                    <button class="special" data-action="clear">AC</button>
                    <button class="special" data-action="backspace">DEL</button>
                    <button class="operator" data-value="%">%</button>
                    <button class="operator" data-value="/">÷</button>

                    <button data-value="7">7</button>
                    <button data-value="8">8</button>
                    <button data-value="9">9</button>
                    <button class="operator" data-value="*">×</button>

                    <button data-value="4">4</button>
                    <button data-value="5">5</button>
                    <button data-value="6">6</button>
                    <button class="operator" data-value="-">−</button>

                    <button data-value="1">1</button>
                    <button data-value="2">2</button>
                    <button data-value="3">3</button>
                    <button class="operator" data-value="+">+</button>

                    <button class="wide" data-value="0">0</button>
                    <button data-value=".">.</button>
                    <button class="equals" data-action="calculate">=</button>
                </div>
            </section>

            <aside class="history-panel">
                <div class="history-heading">
                    <h2>History</h2>
                    <button id="clearHistory">Clear</button>
                </div>
                <div id="history" class="history">
                    <p class="empty">Your calculations will appear here.</p>
                </div>
            </aside>
        </main>

        <footer>
            <span>Python + Flask</span>
            <span>Keyboard supported</span>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
